<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diabetes Prediction AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container">
        <div class="header-actions">
            <a href="{{ url_for('logout') }}" class="logout-btn">Log Out</a>
        </div>
        
        <h1>Diabetes Risk Predictor</h1>
        <p class="subtitle">Enter your clinical parameters below for an AI-driven risk assessment.</p>
        
        <form id="prediction-form">
            <div class="form-grid">
                <div class="form-group">
                    <input type="number" id="pregnancies" required min="0" step="1" placeholder="e.g., 2">
                    <label for="pregnancies">Pregnancies</label>
                </div>
                <div class="form-group">
                    <input type="number" id="glucose" required min="0" step="0.1" placeholder="e.g., 120">
                    <label for="glucose">Glucose (mg/dL)</label>
                </div>
                <div class="form-group">
                    <input type="number" id="bloodPressure" required min="0" step="0.1" placeholder="e.g., 70">
                    <label for="bloodPressure">Blood Pressure (mm Hg)</label>
                </div>
                <div class="form-group">
                    <input type="number" id="skinThickness" required min="0" step="0.1" placeholder="e.g., 20">
                    <label for="skinThickness">Skin Thickness (mm)</label>
                </div>
                <div class="form-group">
                    <input type="number" id="insulin" required min="0" step="0.1" placeholder="e.g., 79">
                    <label for="insulin">Insulin (IU/mL)</label>
                </div>
                <div class="form-group">
                    <input type="number" id="bmi" required min="0" step="0.1" placeholder="e.g., 25.5">
                    <label for="bmi">BMI</label>
                </div>
                <div class="form-group">
                    <input type="number" id="dpf" required min="0" step="0.001" placeholder="e.g., 0.45">
                    <label for="dpf">Pedigree Function</label>
                </div>
                <div class="form-group">
                    <input type="number" id="age" required min="0" step="1" placeholder="e.g., 35">
                    <label for="age">Age</label>
                </div>
            </div>
            
            <div class="btn-container">
                <button type="submit" id="submit-btn">Analyze Data</button>
                <div class="loader" id="loader"></div>
            </div>
        </form>

        <div id="result" class="hidden"></div>
    </div>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
